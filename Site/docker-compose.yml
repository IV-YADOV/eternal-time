version: '3.9'
services:
  db:
    image: postgres:16-alpine
    restart: always
    command: postgres -c shared_buffers=256MB -c effective_cache_size=512MB -c work_mem=4MB -c max_connections=50
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: watchshop
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    expose:
      - "5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - /opt/eternal-time/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
